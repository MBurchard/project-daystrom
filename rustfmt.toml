edition = "2024"
style_edition = "2024"

# Keep 120 as the hard line limit, but let dense constructs wrap earlier.
# This keeps comments and control flow readable without forcing full-project reformatting.
max_width = 120
use_small_heuristics = "Default"
fn_call_width = 80
attr_fn_like_width = 80
struct_lit_width = 40
struct_variant_width = 60
array_width = 100
chain_width = 80
single_line_if_else_max_width = 80
single_line_let_else_max_width = 80
