name: Build macOS App

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to build
        required: false
        type: string
      updater:
        description: Build signed updater artifacts for a release draft
        default: false
        required: false
        type: boolean

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Validate release signing secrets
        if: inputs.updater
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for NAME in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID \
            APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Required release secret $NAME is missing" >&2
              exit 1
            fi
          done

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/modules/backend -> target
            rust-mod -> target

      # Standalone builds may be unsigned; updater release builds validate these secrets above.
      - name: Import Apple signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

          rm "$CERT_PATH"

      - name: Build universal mod library
        run: pnpm build:mod:mac-universal

      - name: Sign mod library for notarization
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: >-
          codesign --force --sign "$APPLE_SIGNING_IDENTITY"
          --timestamp --options runtime
          app/resources/mod/libstfc-mod.dylib

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Generate TypeScript bindings (ts-rs)
        run: pnpm test:app:backend

      - name: Build universal macOS app
        if: ${{ !inputs.updater }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm build:tauri:mac-universal

      - name: Build universal macOS app and updater
        if: inputs.updater
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm build:tauri:mac-universal:updater

      - name: Verify macOS updater signature
        if: inputs.updater
        shell: bash
        run: |
          shopt -s nullglob
          archives=(app/modules/backend/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS updater archive, found ${#archives[@]}" >&2
            exit 1
          fi
          pnpm verify:update-signature "${archives[0]}" "${archives[0]}.sig"

      - name: Clean up signing keychain
        if: always() && env.HAS_APPLE_CERT == 'true'
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: Project-Daystrom-macOS-universal
          path: app/modules/backend/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload macOS updater archive
        if: inputs.updater
        uses: actions/upload-artifact@v7
        with:
          name: Project-Daystrom-macOS-updater
          path: |
            app/modules/backend/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            app/modules/backend/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 30
