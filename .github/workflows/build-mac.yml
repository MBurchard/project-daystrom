name: Build macOS App

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/modules/backend -> target
            rust-mod -> target

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Generate TypeScript bindings (ts-rs)
        run: pnpm test:app:backend

      - name: Build universal macOS app
        run: pnpm build:app:mac-universal

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: Project-Daystrom-macOS-universal
          path: app/modules/backend/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
