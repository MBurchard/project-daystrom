name: Build Windows App

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows App (x64)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}

    steps:
      - name: Locate signtool.exe
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          Write-Host "=== Windows SDK versions ==="
          Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64' |
            ForEach-Object { Write-Host $_.FullName }
          Write-Host "=== signtool.exe locations ==="
          $signtool = Get-ChildItem `
            'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' `
            -ErrorAction SilentlyContinue |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in any Windows SDK' }
          Write-Host "Using $($signtool.FullName)"
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/modules/backend -> target
            rust-mod -> target

      - name: Build mod library
        run: pnpm build:mod

      - name: Generate Tauri icons
        run: pnpm icons

      - name: Generate TypeScript bindings (ts-rs)
        run: pnpm test:app:backend

      - name: Build Windows app
        run: pnpm build:tauri:windows

      # Code signing (optional, requires WINDOWS_PFX_BASE64 and WINDOWS_PFX_PASSWORD secrets)
      - name: Import code signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64)
          $pfxPath = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force)
          Remove-Item $pfxPath
          Write-Host "Imported certificate: $($cert.Subject) [$($cert.Thumbprint)]"
          "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}

      - name: Sign NSIS installer
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          $exe = Get-ChildItem app/modules/backend/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          & $env:SIGNTOOL_PATH sign /fd sha256 /tr http://timestamp.digicert.com `
            /td sha256 /sha1 $env:CERT_THUMBPRINT $exe.FullName
          Write-Host "Signed $($exe.Name)"
        shell: pwsh

      - name: Upload setup .exe
        uses: actions/upload-artifact@v7
        with:
          name: Project-Daystrom-Windows-x64
          path: app/modules/backend/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
