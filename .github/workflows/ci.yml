name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Cache Cargo artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/modules/backend -> target
      - name: Create mod dylib stub for Tauri build script
        run: mkdir -p app/resources/mod && touch app/resources/mod/libstfc-community-patch.dylib
      - name: Generate Tauri icons
        run: pnpm icons
      - name: Run backend tests and generate TypeScript bindings
        run: pnpm test:app:backend
      - name: Run mod tests
        run: pnpm test:mod
      - name: Lint
        run: pnpm lint:ci
      - name: Typecheck
        run: pnpm typecheck
      - name: Run frontend tests
        run: pnpm test:app:frontend
      - name: Run tooling tests
        run: pnpm test:tooling

  native-rust:
    name: Native Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-latest
            mod_resource: app/resources/mod/libstfc-mod.dylib
          - platform: Windows
            runner: windows-latest
            mod_resource: app/resources/mod/stfc-mod.dll

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/modules/backend -> target
            rust-mod -> target
      - name: Create mod library stub for Tauri build script
        shell: bash
        run: mkdir -p app/resources/mod && touch "${{ matrix.mod_resource }}"
      - name: Generate Tauri icons
        run: pnpm icons
      - name: Run strict native Rust lint
        run: pnpm lint:native:ci
      - name: Run backend tests
        run: pnpm test:app:backend
      - name: Run mod tests
        run: pnpm test:mod
